<!--
  Offer Breakdown video tracking — paste into GHL:
  Funnel "DFY" → step /call-scheduled-dfy → Settings → Tracking Code → FOOTER code.
  (13 Nov 2026, Aakash/Sahil.) Safe to paste once; does nothing on a page without a video.

  The video on that page is GHL's own video player (~34 min). It AUTOPLAYS MUTED, so muted playback is NOT counted.
  A second counts only when the video is playing WITH SOUND ON and the tab is in front of the person.
  Skipping ahead does not count. Every time the lead passes another 5% it tells Supabase (function video-progress),
  which saves the %, sets the GHL field "Offer Video Watched %" and adds the tag offer-video-25 / -50 / -75 / -100.

  Who the lead is: the email/phone GHL saved in this browser when they applied (localStorage "_ud"),
  or ?contact_id= / ?email= / ?phone= in the page link if present.
-->
<script>
(function () {
  var MEDIA = "offer-breakdown";
  var URL_ = "https://ugiurxkbbuhtvbehpkvb.supabase.co/functions/v1/video-progress";
  var KEY = "ioc_vw_" + MEDIA;
  if (window.__iocVideoWatch) return; window.__iocVideoWatch = 1;

  // ---------- who is watching ----------
  function ident() {
    var out = {}, q = new URLSearchParams(location.search);
    ["contact_id", "email", "phone"].forEach(function (k) { if (q.get(k)) out[k] = q.get(k); });
    if (!out.contact_id && q.get("contactId")) out.contact_id = q.get("contactId");
    try {
      var ud = JSON.parse(localStorage.getItem("_ud") || "{}");
      (function walk(o, d) {
        if (!o || typeof o !== "object" || d > 3) return;
        Object.keys(o).forEach(function (k) {
          var v = o[k];
          if (typeof v === "string") {
            if (!out.email && /email/i.test(k) && /@/.test(v)) out.email = v.trim();
            else if (!out.phone && /phone/i.test(k) && v.replace(/\D/g, "").length >= 10) out.phone = v.trim();
            else if (!out.contact_id && /^(contact_?id|contactId)$/i.test(k) && v.length > 10) out.contact_id = v.trim();
          } else walk(v, d + 1);
        });
      })(ud, 0);
    } catch (e) {}
    return out;
  }

  // ---------- seconds actually watched (kept in this browser so a revisit continues) ----------
  var st = { secs: {}, sent: 0 };
  try { var s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.secs) st = s; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var duration = 0, lastT = null, started = 0, vidId = "";

  function count() { return Object.keys(st.secs).length; }
  function pct() { return duration ? Math.min(100, Math.round(count() * 100 / duration)) : 0; }
  function send(force) {
    var p = pct(), step = p >= 95 ? 100 : Math.floor(p / 5) * 5;
    if (!force && step <= st.sent) return;
    if (step > st.sent) st.sent = step;
    save();
    var body = JSON.stringify({ media: MEDIA, el: vidId, pct: p, watched: count(), duration: Math.round(duration),
      start: started === 1 ? 1 : 0, page: location.pathname, ident: ident() });
    if (started === 1) started = 2;
    try { if (navigator.sendBeacon && navigator.sendBeacon(URL_, new Blob([body], { type: "text/plain" }))) return; } catch (e) {}
    try { fetch(URL_, { method: "POST", headers: { "Content-Type": "text/plain" }, body: body, keepalive: true }); } catch (e) {}
  }

  // the biggest visible <video> on the page = the offer video
  function video() {
    var vs = document.querySelectorAll("video"), best = null, bw = 0;
    for (var i = 0; i < vs.length; i++) {
      var w = vs[i].getBoundingClientRect().width;
      if (w > bw && vs[i].duration > 60) { best = vs[i]; bw = w; }
    }
    return best;
  }

  setInterval(function () {
    var v = video();
    if (!v) return;
    if (isFinite(v.duration) && v.duration > 0) duration = v.duration;
    vidId = (v.closest('[id^="video-"]') || v).id || "";
    var watching = !v.paused && !v.ended && !v.muted && v.volume > 0 && document.visibilityState === "visible";
    var t = v.currentTime;
    if (!watching) { lastT = t; return; }
    if (!started) started = 1;
    if (lastT !== null) {
      var dt = t - lastT;
      // normal playback (up to ~2x speed) counts; a jump / seek does not
      if (dt > 0 && dt <= 2.5) for (var x = Math.floor(lastT); x < Math.floor(t); x++) st.secs[x] = 1;
    }
    lastT = t;
    send(false);
  }, 1000);

  // last ping when they leave or switch away
  function bye() { if (count()) send(true); }
  window.addEventListener("pagehide", bye);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") bye(); });
})();
</script>
