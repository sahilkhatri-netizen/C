<!--
  IOC funnel video tracking — LIVE version, copied from the DFY funnel's Body Tracking Code on 14 Nov 2026.
  Installed in: Funnel "IOC (dfy3.3)" → Settings → Body Tracking Code, AFTER the Google Tag Manager (noscript) code (keep that).
  v2: each page's MAIN video = the top-most video (power-funnel on "/", offer-breakdown on "/call-scheduled-dfy");
  every other clip on these pages is tracked as "testimonials". Sound-on seconds only. See README.md.
-->
<script>
(function () {
  if (window.__iocVideoWatch) return; window.__iocVideoWatch = 2;
  var URL_ = "https://ugiurxkbbuhtvbehpkvb.supabase.co/functions/v1/video-progress";
  // page -> its MAIN video (the top-most video on the page). Every other video on these pages is a testimonial.
  var PAGES = { "/": "power-funnel", "/call-scheduled-dfy": "offer-breakdown" };
  var MIN_MAIN = 300;                // a main video is never shorter than 5 minutes
  var TKEY = "ioc_vw_testimonials";
  var path = location.pathname.replace(/\/+$/, "") || "/";
  var MEDIA = PAGES[path] || null;   // null = this page has no tracked video (still sends any saved progress)

  // ---------- who is watching ----------
  function ident() {
    var out = {}, q = new URLSearchParams(location.search);
    ["contact_id", "email", "phone"].forEach(function (k) { if (q.get(k)) out[k] = q.get(k); });
    if (!out.contact_id && q.get("contactId")) out.contact_id = q.get("contactId");
    try {
      var ud = JSON.parse(localStorage.getItem("_ud") || "{}");
      (function walk(o, d) {
        if (!o || typeof o !== "object" || d > 3) return;
        Object.keys(o).forEach(function (k) {
          var v = o[k];
          if (typeof v === "string") {
            if (!out.email && /email/i.test(k) && /@/.test(v)) out.email = v.trim();
            else if (!out.phone && /phone/i.test(k) && v.replace(/\D/g, "").length >= 10) out.phone = v.trim();
            else if (!out.contact_id && /^(contact_?id|contactId)$/i.test(k) && v.length > 10) out.contact_id = v.trim();
          } else walk(v, d + 1);
        });
      })(ud, 0);
    } catch (e) {}
    return (out.contact_id || out.email || out.phone) ? out : null;
  }

  function post(obj) {
    var body = JSON.stringify(obj);
    try { if (navigator.sendBeacon && navigator.sendBeacon(URL_, new Blob([body], { type: "text/plain" }))) return; } catch (e) {}
    try { fetch(URL_, { method: "POST", headers: { "Content-Type": "text/plain" }, body: body, keepalive: true }); } catch (e) {}
  }

  // ---------- main video progress, kept in this browser ----------
  // (progress saved by the old script against a short clip is thrown away)
  function load(m) { try { var s = JSON.parse(localStorage.getItem("ioc_vw_" + m) || "null"); if (s && s.secs && !(s.dur && s.dur < MIN_MAIN)) return s; } catch (e) {} return { secs: {}, sent: 0, dur: 0 }; }
  function store(m, s) { try { localStorage.setItem("ioc_vw_" + m, JSON.stringify(s)); } catch (e) {} }
  function count(s) { return Object.keys(s.secs).length; }
  function pct(s) { return s.dur ? Math.min(100, Math.round(count(s) * 100 / s.dur)) : 0; }

  // send a main video's progress when it passes a new 5% step (force = also send anything not sent yet)
  function flush(m, force) {
    var s = load(m), p = pct(s), n = count(s);
    if (!n || !s.dur || s.dur < MIN_MAIN) return;
    var step = p >= 95 ? 100 : Math.floor(p / 5) * 5;
    if (!force && step <= s.sent) return;
    if (force && step <= s.sent && s.sentN === n) return;   // nothing new since the last send
    var who = ident();
    if (!who) return;                // not known yet: keep it, send later
    if (step > s.sent) s.sent = step;
    s.sentN = n; store(m, s);
    post({ media: m, pct: p, watched: n, duration: Math.round(s.dur), page: path, ident: who });
  }

  // ---------- testimonial clips, kept in this browser ----------
  function loadT() { try { var t = JSON.parse(localStorage.getItem(TKEY) || "null"); if (t && t.clips) return t; } catch (e) {} return { clips: {}, total: 0, sentSeen: 0, sentSec: 0 }; }
  function storeT(t) { try { localStorage.setItem(TKEY, JSON.stringify(t)); } catch (e) {} }
  function sumT(t) {
    var seen = 0, sec = 0, dur = 0, list = [];
    Object.keys(t.clips).forEach(function (k) {
      var c = t.clips[k], w = Object.keys(c.secs || {}).length;
      if (!w) return;
      sec += w; dur += Math.round(c.d || 0);
      if (c.d && w >= c.d * 0.5) seen++;          // half of a clip played = watched
      list.push({ k: k, n: c.n || "", d: Math.round(c.d || 0), w: w });
    });
    return { seen: seen, sec: sec, dur: dur, list: list };
  }
  // send when another clip gets watched or 15 more seconds were played (force = also send anything not sent yet)
  function flushT(force) {
    var t = loadT(), s = sumT(t);
    if (s.sec < 3) return;
    if (!force && !(s.seen > t.sentSeen || s.sec >= t.sentSec + 15)) return;
    if (force && s.seen === t.sentSeen && s.sec === t.sentSec) return;
    var who = ident();
    if (!who) return;
    t.sentSeen = s.seen; t.sentSec = s.sec; storeT(t);
    post({ media: "testimonials", pct: t.total ? Math.min(100, Math.round(s.seen * 100 / t.total)) : 0, watched: s.sec, duration: s.dur,
           total: t.total, clips: s.list, page: path, ident: who });
  }
  function flushAll(force) { for (var k in PAGES) flush(PAGES[k], force); flushT(force); }

  // ---------- which video is which ----------
  function vids() {               // visible videos, top of the page first
    var a = [], vs = document.querySelectorAll("video");
    for (var i = 0; i < vs.length; i++) {
      var r = vs[i].getBoundingClientRect();
      if (r.width > 0) a.push({ v: vs[i], y: r.top + (window.pageYOffset || 0) });
    }
    a.sort(function (x, y) { return x.y - y.y; });
    return a;
  }
  function clipKey(v) {
    if (v.__iocK) return v.__iocK;
    var k = v.id || "";            // GHL gives each video element a fixed id; the file name is the fallback
    if (!k) {
      var src = v.currentSrc || v.src || ((v.querySelector("source") || {}).src) || "";
      k = /^blob:|^data:/.test(src) ? "" : src.split("#")[0].split("?")[0].split("/").pop();
    }
    k = (k || "").slice(-60);
    if (k) v.__iocK = k;
    return k;
  }
  function clipName(v) {          // the heading shown with the clip, e.g. "Mohak - Founder of FitJam"
    if (v.__iocN) return v.__iocN;
    var el = v, n = "";
    for (var i = 0; i < 8 && el; i++) {
      el = el.parentElement;
      var h = el && el.querySelector("h1,h2,h3,h4,strong");
      if (h && (h.innerText || "").trim()) { n = h.innerText.trim().replace(/\s+/g, " ").slice(0, 60); break; }
    }
    if (n) v.__iocN = n;
    return n;
  }

  setInterval(function () {
    if (!MEDIA) { flushAll(false); return; }
    var a = vids();
    if (!a.length) return;
    var main = a[0].v;                                       // top-most video = the page's main video
    if (isFinite(main.duration) && main.duration > 0 && main.duration < MIN_MAIN) main = null;
    var visible = document.visibilityState === "visible";
    var s = null, t = null, nT = 0, x;
    for (var i = 0; i < a.length; i++) {
      var v = a[i].v, cur = v.currentTime, last = v.__iocT;
      v.__iocT = cur;
      var isMain = v === main;
      if (!isMain) nT++;
      if (isMain) { s = load(MEDIA); if (isFinite(v.duration) && v.duration >= MIN_MAIN) s.dur = v.duration; }
      var watching = visible && !v.paused && !v.ended && !v.muted && v.volume > 0;
      if (!watching || last == null) continue;
      var dt = cur - last;
      if (!(dt > 0 && dt <= 2.5)) continue;                  // normal playback (up to ~2x speed) counts; a jump / seek does not
      if (isMain) { for (x = Math.floor(last); x < Math.floor(cur); x++) s.secs[x] = 1; }
      else {
        var k = clipKey(v);
        if (!k) continue;
        t = t || loadT();
        var c = t.clips[k] || (t.clips[k] = { n: "", d: 0, secs: {} });
        if (!c.n) c.n = clipName(v);
        if (isFinite(v.duration) && v.duration > 0) c.d = v.duration;
        for (x = Math.floor(last); x < Math.floor(cur); x++) c.secs[x] = 1;
      }
    }
    if (s) { store(MEDIA, s); flush(MEDIA, false); }
    if (nT) {
      if (!t) { var t0 = loadT(); if (nT > (t0.total || 0)) t = t0; }
      if (t) { if (nT > (t.total || 0)) t.total = nT; storeT(t); flushT(false); }
    }
  }, 1000);

  // send anything saved from earlier pages now (e.g. Power Funnel / testimonial progress once they've applied)
  setTimeout(function () { flushAll(true); }, 1500);
  function bye() { flushAll(true); }
  window.addEventListener("pagehide", bye);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") bye(); });
})();
</script>
