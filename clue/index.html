<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A simple Clue detective notebook: 3-step setup, one button per turn, automatic deductions, and predictions.">
<title>Clue Detective Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;6..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: guided 3-step start, then one game screen (verdict + sheet) with a single sticky "Record a turn" action; everything else lives in the menu. */
:root{
  --bg:#eceff3; --paper:#ffffff; --ink:#18212c; --muted:#5b6876; --line:#d3d9e1; --soft:#f4f6f9;
  --accent:#9b1c2e; --accent-ink:#ffffff; --accent-soft:#f6e4e7;
  --yes:#1d7a4c; --yes-bg:#dff1e7; --no:#6b7684; --no-bg:#e6eaef; --maybe:#a8700f; --maybe-bg:#fbf0d9;
  --bad:#b3261e; --bad-bg:#fbe3e1; --scrim:rgba(15,20,26,.45);
  --f-display:"Bodoni Moda", "Didot", Georgia, serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --paper:#171e27; --ink:#e5eaf0; --muted:#97a4b2; --line:#2a3542; --soft:#1d2530;
  --accent:#e3566b; --accent-ink:#1a0a0d; --accent-soft:#3a1c22;
  --yes:#5fd39a; --yes-bg:#173527; --no:#8693a2; --no-bg:#232c37; --maybe:#f0b54a; --maybe-bg:#3a2e14;
  --bad:#ff8a80; --bad-bg:#3d1c1a; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f141a; --paper:#171e27; --ink:#e5eaf0; --muted:#97a4b2; --line:#2a3542; --soft:#1d2530;
  --accent:#e3566b; --accent-ink:#1a0a0d; --accent-soft:#3a1c22;
  --yes:#5fd39a; --yes-bg:#173527; --no:#8693a2; --no-bg:#232c37; --maybe:#f0b54a; --maybe-bg:#3a2e14;
  --bad:#ff8a80; --bad-bg:#3d1c1a; --scrim:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.wrap.nobar{padding-block-end:40px}
h1{font-family:var(--f-display);font-weight:800;margin:0;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:22px;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.4}
.btn.wide{flex:1}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.link.plain{color:var(--muted)}

/* chips used for every choice */
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;gap:7px;font-weight:500}
.pick:hover:not(:disabled){border-color:var(--muted)}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick:disabled{opacity:.4}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.18)}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* wizard */
.wiz{max-width:620px;width:100%;margin:0 auto;display:grid;gap:18px}
.hero{display:grid;gap:6px;padding-top:8px}
.hero h1{font-size:clamp(32px,7vw,44px)}
.steps{display:flex;gap:6px}
.steps span{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--accent)}
.num{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.num .pick{justify-content:center;font-size:18px;font-family:var(--f-mono)}
.names{display:grid;gap:8px}
.nrow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}
.nrow .seat{font-family:var(--f-mono);color:var(--muted);text-align:center;font-size:14px}
input[type=text],textarea,select{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.hint{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--muted)}
.hint b{color:var(--ink)}
.alert{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:14px}
.group{display:grid;gap:8px}
.group>.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* game header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.top h1{font-size:24px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;display:grid;min-width:230px;z-index:30}
.menu button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:8px;font-weight:500;display:flex;justify-content:space-between;gap:10px}
.menu button:hover{background:var(--soft)}
.menu .danger{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

.verdict{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.slot .q{font-size:12px;color:var(--muted);font-weight:600}
.slot .v{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.slot .s{font-size:12px;color:var(--muted)}
.slot.solved{border-color:var(--accent);background:var(--accent-soft)}
.slot.solved .v{color:var(--accent)}

.tip{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.tip ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}

/* sheet */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
table.sheet{border-collapse:separate;border-spacing:0;width:100%}
.sheet th,.sheet td{border-bottom:1px solid var(--line);padding:0}
.sheet tr:last-child>*{border-bottom:0}
.sheet thead th{background:var(--soft);font-weight:600;font-size:12px;padding:8px 4px;text-align:center;vertical-align:bottom}
.sheet .namecol{position:sticky;left:0;background:var(--paper);z-index:1;text-align:left;min-width:128px}
.sheet thead .namecol{background:var(--soft);z-index:2;padding-left:12px}
.sheet .cat td{background:var(--soft);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:6px 12px}
.cardname{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;font-weight:500;font-size:15px}
tr.cleared .nm{text-decoration:line-through;color:var(--muted)}
tr.solution .namecol{box-shadow:inset 4px 0 0 var(--accent)}
tr.solution .nm{color:var(--accent);font-weight:700}
.ph{display:grid;justify-items:center;gap:1px;min-width:50px}
.ph .pn{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--ink)}
.ph .pn.me{color:var(--accent)}
.ph .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
td.cell{text-align:center;padding:3px 2px}
td.env{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.mk{width:40px;height:34px;border-radius:8px;border:1px solid transparent;background:none;display:inline-grid;place-items:center;font-weight:700;font-size:16px;line-height:1}
.mk:hover{border-color:var(--line)}
.mk.y{background:var(--yes-bg);color:var(--yes)}
.mk.n{background:var(--no-bg);color:var(--no)}
.mk.m{background:var(--maybe-bg);color:var(--maybe)}
.mk.auto{background:none;border:1.5px dashed currentColor}
.mk.conflict{background:var(--bad-bg);color:var(--bad);border:1.5px solid var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .mk{width:24px;height:22px;font-size:12px}
@media (max-width:520px){.sheet .namecol{min-width:104px}.cardname{font-size:13px;padding-left:8px;gap:6px}.mk{width:32px;height:32px}.ph{min-width:38px}.ph .pn{max-width:46px;font-size:12px}.ph .meta{font-size:10px}td.cell{padding:3px 1px}.slot .v{font-size:16px}}

/* predictions */
.pred{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pgroup{display:grid;gap:6px;min-width:0}
.pgroup .lab{font-size:12px;color:var(--muted);font-weight:600}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 70px 38px;gap:8px;align-items:center;font-size:14px}
.prow .pn{display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:var(--accent)}
.pp{text-align:right;font-size:13px}
.ask{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:12px 14px}
.ask>div{min-width:0;flex:1 1 240px;display:grid;gap:4px}
.mk.pc{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--accent)}

/* sticky bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:20;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:900px;margin:0 auto;display:flex;gap:10px}

/* turn dialog */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.dialog{background:var(--paper);width:100%;max-width:600px;max-height:92%;border-radius:18px 18px 0 0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
@media (min-width:700px){.scrim{align-items:center}.dialog{border-radius:18px;max-height:88%}}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dbody{overflow-y:auto;padding:16px 18px;display:grid;gap:22px;align-content:start}
.dfoot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.qn{display:grid;gap:10px}
.qn>h3 .sub{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 12px;font-size:14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.resp{display:grid;grid-template-columns:minmax(80px,auto) 1fr;gap:8px 12px;align-items:center}
.resp .who{font-weight:600;overflow-wrap:anywhere}
.x{border:0;background:none;width:40px;height:40px;border-radius:10px;font-size:20px;color:var(--muted)}
.x:hover{background:var(--soft);color:var(--ink)}

/* history */
.log{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.log li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;background:var(--paper)}
.log .t{display:grid;gap:4px;min-width:0}
.tagc{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:13px;margin:2px 3px 2px 0}
.tagc.on{border-color:var(--accent);color:var(--accent)}

/* settings + cards */
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.crow input[type=color]{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;padding:0;background:none;overflow:hidden}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.catbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px 14px;font-size:14px}
table.ref{border-collapse:collapse;font-size:14px}
table.ref th,table.ref td{border-bottom:1px solid var(--line);padding:6px 12px;text-align:left}
table.ref td{font-family:var(--f-mono)}
label.chk{display:flex;gap:10px;align-items:center}
label.chk input{width:20px;height:20px;accent-color:var(--accent)}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.mk,.pick{transition:background .12s,color .12s,border-color .12s}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>

<body>
<div id="app"></div>

<script>
(function(){
const KEY='clue-notebook-v3';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PRESETS={
  'clue-2016':{label:'Clue 2016–2022 (Dr. Orchid)',cats:[
    {name:'Suspects',q:'Who?',cards:[['Col. Mustard','#d4a017'],['Dr. Orchid','#d26fc7'],['Prof. Plum','#7b3f8c'],['Mr. Green','#2e7d4f'],['Mrs. Peacock','#1f6fa8'],['Miss Scarlett','#c62828']]},
    {name:'Weapons',q:'With what?',cards:['Dagger','Candlestick','Revolver','Rope','Lead Pipe','Wrench']},
    {name:'Rooms',q:'Where?',cards:['Dining Room','Kitchen','Conservatory','Billiard Room','Library','Lounge','Hall','Ballroom','Study']}]},
  'clue-classic':{label:'Classic Clue (Mrs. White)',cats:[
    {name:'Suspects',q:'Who?',cards:[['Col. Mustard','#d4a017'],['Mrs. White','#c9ced4'],['Prof. Plum','#7b3f8c'],['Mr. Green','#2e7d4f'],['Mrs. Peacock','#1f6fa8'],['Miss Scarlett','#c62828']]},
    {name:'Weapons',q:'With what?',cards:['Candlestick','Knife','Lead Pipe','Revolver','Rope','Wrench']},
    {name:'Rooms',q:'Where?',cards:['Hall','Lounge','Dining Room','Kitchen','Ballroom','Conservatory','Billiard Room','Library','Study']}]},
  'blank':{label:'Empty deck (make your own)',cats:[
    {name:'Suspects',q:'Who?',cards:[]},{name:'Weapons',q:'With what?',cards:[]},{name:'Rooms',q:'Where?',cards:[]}]}
};
const buildCats=k=>PRESETS[k].cats.map(c=>({id:uid(),name:c.name,q:c.q,cards:c.cards.map(x=>Array.isArray(x)?{id:uid(),name:x[0],color:x[1]}:{id:uid(),name:x})}));

function freshGame(prev){
  const players=prev?prev.players:[{id:uid(),name:''},{id:uid(),name:''},{id:uid(),name:''},{id:uid(),name:''}];
  return {started:false,step:1,view:'game',categories:prev?prev.categories:buildCats('clue-2016'),players,me:players[0].id,
    extras:prev?prev.extras:[],leftover:prev?prev.leftover:'deal',faceup:[],hand:[],marks:{},log:[],notes:'',
    auto:true,rule:prev?prev.rule:'first',tip:true,showPred:prev?prev.showPred!==false:true,draft:null,modal:false,menu:false,confirm:null,pendingPreset:null};
}
let state; try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!state.categories||!state.players) state=freshGame();
let history=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
function commit(fn){history.push(JSON.stringify(state)); if(history.length>100)history.shift(); fn(); save(); render();}
function ui(fn){fn(); save(); render();}

const allCards=()=>state.categories.flatMap(c=>c.cards.map(k=>({...k,cat:c.id})));
const cardById=id=>allCards().find(c=>c.id===id);
const pIdx=id=>state.players.findIndex(p=>p.id===id);
const pName=id=>{if(id==='env')return 'Envelope'; const i=pIdx(id); if(i<0)return '?'; const p=state.players[i]; return p.name.trim()||(p.id===state.me?'You':'Player '+(i+1));};
const cats=()=>state.categories.filter(c=>c.cards.length);
const dot=c=>c&&c.color?`<span class="dot" style="background:${esc(c.color)}"></span>`:'';

/* ---------- deal ---------- */
function dealInfo(){
  const n=state.players.length, envN=cats().length, total=allCards().length;
  const dealtAll=Math.max(0,total-envN), base=Math.floor(dealtAll/n), rem=dealtAll%n;
  const ex=(state.extras||[]).filter(id=>pIdx(id)>=0);
  const sizes={}, extra={};
  state.players.forEach(p=>{const e=state.leftover==='deal'&&ex.includes(p.id); extra[p.id]=e; sizes[p.id]=base+(e?1:0);});
  const known=rem===0||(state.leftover==='deal'?ex.length===rem:state.faceup.length===rem);
  return {n,envN,total,dealtAll,base,rem,sizes,extra,known,exCount:ex.length};
}

/* ---------- deduction ---------- */
function solve(){
  const owners=[...state.players.map(p=>p.id),'env'];
  const cards=allCards(); const K={}; cards.forEach(c=>K[c.id]={});
  const conflicts=new Set(); const D=dealInfo(); let changed=true;
  const set=(cid,o,v)=>{if(!K[cid])return; const cur=K[cid][o]; if(cur===v)return; if(cur){conflicts.add(cid+'|'+o);return;} K[cid][o]=v; changed=true;};
  const facts=[];
  for(const cid in state.marks) for(const o in state.marks[cid]){const v=state.marks[cid][o]; if(v==='y'||v==='n')facts.push([cid,o,v]);}
  state.faceup.forEach(cid=>owners.forEach(o=>facts.push([cid,o,'n'])));
  if(state.hand.length) cards.forEach(c=>facts.push([c.id,state.me,state.hand.includes(c.id)?'y':'n']));
  const n=state.players.length, constraints=[], envClauses=[];
  state.log.forEach(e=>{
    const ids=e.cards.filter(id=>K[id]);
    if(e.type==='accuse'){if(ids.length)envClauses.push(ids);return;}
    const s=pIdx(e.by); if(s<0)return;
    if(e.responses){
      for(const pid in e.responses){const r=e.responses[pid]; if(pIdx(pid)<0)continue;
        if(r==='none')ids.forEach(cid=>facts.push([cid,pid,'n']));
        else if(r==='some')constraints.push([pid,ids]);
        else if(K[r])facts.push([r,pid,'y']);}
      return;
    }
    const w=e.shower?pIdx(e.shower):-1;
    for(let i=(s+1)%n;i!==s&&i!==w;i=(i+1)%n) ids.forEach(cid=>facts.push([cid,state.players[i].id,'n']));
    if(w>=0){if(e.shown&&K[e.shown])facts.push([e.shown,e.shower,'y']); else constraints.push([e.shower,ids]);}
  });
  let guard=0;
  while(changed&&guard++<80){
    changed=false;
    facts.forEach(f=>set(f[0],f[1],f[2]));
    if(!state.auto)break;
    cards.forEach(c=>{const k=K[c.id];
      const yes=owners.filter(o=>k[o]==='y'); if(yes.length)owners.forEach(o=>{if(o!==yes[0])set(c.id,o,'n')});
      const open=owners.filter(o=>k[o]!=='n'); if(open.length===1&&!k[open[0]])set(c.id,open[0],'y');
    });
    cats().forEach(cat=>{
      const inEnv=cat.cards.filter(c=>K[c.id].env==='y'); if(inEnv.length)cat.cards.forEach(c=>{if(c.id!==inEnv[0].id)set(c.id,'env','n')});
      const open=cat.cards.filter(c=>K[c.id].env!=='n'); if(open.length===1)set(open[0].id,'env','y');
    });
    if(D.known) state.players.forEach(p=>{const h=D.sizes[p.id];
      const yes=cards.filter(c=>K[c.id][p.id]==='y'), open=cards.filter(c=>K[c.id][p.id]!=='n');
      if(yes.length===h)cards.forEach(c=>{if(K[c.id][p.id]!=='y')set(c.id,p.id,'n')});
      else if(open.length===h)open.forEach(c=>set(c.id,p.id,'y'));
    });
    constraints.forEach(([pid,ids])=>{const open=ids.filter(id=>K[id][pid]!=='n'); if(open.length===1)set(open[0],pid,'y');});
    envClauses.forEach(ids=>{const yes=ids.filter(id=>K[id].env==='y'),unk=ids.filter(id=>!K[id].env); if(yes.length===ids.length-1&&unk.length===1)set(unk[0],'env','n');});
  }
  const maybe=new Set();
  constraints.forEach(([pid,ids])=>{
    if(ids.some(id=>K[id][pid]==='y'))return;
    if(ids.length&&ids.every(id=>K[id][pid]==='n')){ids.forEach(id=>conflicts.add(id+'|'+pid));return;}
    ids.forEach(id=>{if(!K[id][pid])maybe.add(id+'|'+pid)});
  });
  return {K,conflicts,maybe,constraints,envClauses};
}

/* ---------- predictions: sample deals that fit everything recorded ---------- */
let predCache={key:null,res:null};
function rng(seed){let s=(seed>>>0)||1; return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function hashStr(str){let h=2166136261; for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619); return h>>>0;}
function predict(S,D){
  const key=JSON.stringify([state.marks,state.log,state.hand,state.extras,state.faceup,state.leftover,state.players.map(p=>p.id),state.me,allCards().map(c=>c.id),state.auto]);
  if(predCache.key===key) return predCache.res;
  const res=computePredictions(S,D,key); predCache={key,res}; return res;
}
function computePredictions(S,D,key){
  if(!D.known||!cats().length) return {status:'unknown'};
  const K=S.K, players=state.players.map(p=>p.id), C=cats();
  const live=allCards().filter(c=>!state.faceup.includes(c.id));
  const R=rng(hashStr(key)); const samples=[]; let tries=0; const t0=performance.now();
  const envCand=C.map(cat=>{const f=cat.cards.find(c=>K[c.id].env==='y'); return f?[f.id]:cat.cards.filter(c=>K[c.id].env!=='n'&&!state.faceup.includes(c.id)).map(c=>c.id);});
  if(envCand.some(a=>!a.length)) return {status:'none'};
  while(samples.length<1500&&tries<60000&&performance.now()-t0<150){
    tries++;
    const env=envCand.map(a=>a[Math.floor(R()*a.length)]);
    if(env.some(id=>players.some(p=>K[id][p]==='y'))) continue;
    const cap={...D.sizes}, owner={}; let ok=true;
    for(const c of live){ if(env.includes(c.id))continue; const y=players.find(p=>K[c.id][p]==='y'); if(y){ if(cap[y]<=0){ok=false;break;} owner[c.id]=y; cap[y]--; } }
    if(!ok) continue;
    const rest=live.filter(c=>!env.includes(c.id)&&!owner[c.id]).map(c=>c.id);
    for(let i=rest.length-1;i>0;i--){const j=Math.floor(R()*(i+1)); [rest[i],rest[j]]=[rest[j],rest[i]];}
    for(const id of rest){
      const el=players.filter(p=>cap[p]>0&&K[id][p]!=='n'); if(!el.length){ok=false;break;}
      let tot=el.reduce((s,p)=>s+cap[p],0), r=R()*tot, pick=el[el.length-1];
      for(const p of el){ r-=cap[p]; if(r<0){pick=p;break;} }
      owner[id]=pick; cap[pick]--;
    }
    if(!ok) continue;
    if(S.constraints.some(([pid,ids])=>!ids.some(id=>owner[id]===pid))) continue;
    if(S.envClauses.some(ids=>ids.every(id=>env.includes(id)))) continue;
    samples.push({env,owner});
  }
  if(!samples.length) return {status:tries>=60000||performance.now()-t0>=150?'hard':'none'};
  const envP={}; const combos={};
  samples.forEach(s=>{ s.env.forEach(id=>envP[id]=(envP[id]||0)+1); const k=s.env.join('|'); combos[k]=(combos[k]||0)+1; });
  for(const id in envP) envP[id]/=samples.length;
  const bestKey=Object.keys(combos).sort((a,b)=>combos[b]-combos[a])[0];
  // best question for me: the one whose answer is least predictable (most information)
  let ask=null;
  const solvedAll=C.every((cat,i)=>envCand[i].length===1);
  if(!solvedAll&&samples.length>=40){
    const n=players.length, mi=pIdx(state.me), order=[]; for(let i=1;i<n;i++)order.push(players[(mi+i)%n]);
    const use=samples.slice(0,800);
    let combosList=[[]]; C.forEach(cat=>{const nx=[]; combosList.forEach(cb=>cat.cards.forEach(c=>{if(!state.faceup.includes(c.id))nx.push([...cb,c.id])})); combosList=nx.length>3000?nx.slice(0,3000):nx;});
    let best=-1;
    combosList.forEach(ids=>{
      const out={};
      use.forEach(s=>{
        let done=false;
        for(const p of order){const held=ids.filter(id=>s.owner[id]===p); if(held.length){ held.forEach(id=>{const k=p+'|'+id; out[k]=(out[k]||0)+1/held.length;}); done=true; break; }}
        if(!done) out.none=(out.none||0)+1;
      });
      let H=0; for(const k in out){const q=out[k]/use.length; if(q>0)H-=q*Math.log2(q);}
      const tie=ids.reduce((s,id)=>s+(envP[id]||0),0)*0.01;
      if(H+tie>best){best=H+tie; ask={ids,H};}
    });
    if(ask&&ask.H<0.05) ask=null;
  }
  return {status:'ok',n:samples.length,envP,best:bestKey.split('|'),bestP:combos[bestKey]/samples.length,ask};
}

function predCard(S,D,P){
  if(state.showPred===false) return `<button class="link plain" type="button" data-a="togglepred" style="justify-self:start">Show predictions</button>`;
  const solved=cats().every(cat=>cat.cards.some(c=>S.K[c.id].env==='y'));
  const head=`<div class="row spread"><h3>Predictions</h3><button class="link plain" type="button" data-a="togglepred">Hide</button></div>`;
  if(solved) return `<div class="pred">${head}<p><b>Case solved.</b> Make your accusation on your next turn.</p></div>`;
  if(!P||P.status==='unknown') return `<div class="pred">${head}<p class="muted small">Predictions need hand sizes. Go to Menu → Players &amp; your cards and say who got the extra cards.</p></div>`;
  if(P.status==='none') return `<div class="pred">${head}<p class="alert">No deal fits everything recorded, so something was entered wrong. Check Menu → Turn history.</p></div>`;
  if(P.status==='hard') return `<div class="pred">${head}<p class="muted small">Couldn’t find enough deals that fit what’s recorded. Double-check the turn history if this keeps showing.</p></div>`;
  const rows=cats().map(cat=>{
    const list=cat.cards.map(c=>({c,p:P.envP[c.id]||0})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p).slice(0,3);
    return `<div class="pgroup"><span class="lab">${esc(cat.q||cat.name)}</span>${list.map(x=>`<div class="prow"><span class="pn">${dot(x.c)}${esc(x.c.name)}</span><span class="pbar"><i style="width:${Math.round(x.p*100)}%"></i></span><span class="pp count">${pct(x.p)}</span></div>`).join('')}</div>`}).join('');
  const best=P.best.map(id=>esc((cardById(id)||{}).name));
  const ask=P.ask?`<div class="ask"><div><b>Smart question for your next turn</b><div class="picks" style="margin-top:6px">${P.ask.ids.map(id=>{const c=cardById(id);return `<span class="tagc">${dot(c)}${esc(c.name)}</span>`}).join('')}</div>
      <p class="muted small">The answer to this is the hardest to guess, so it should teach you the most.${P.ask.ids.some(id=>state.hand.includes(id))?' It includes a card you hold, which hides what you’re really after.':''}</p></div>
      <button class="btn" type="button" data-a="useask">Ask this</button></div>`:'';
  return `<div class="pred">${head}
    <p class="small">Most likely: <b>${best[0]}</b>, with the <b>${best[1]||'?'}</b>, in the <b>${best[2]||'?'}</b> <span class="muted">(${pct(P.bestP)} chance for all three)</span></p>
    <div class="pgrid">${rows}</div>${ask}
    <p class="muted small">Based on ${P.n.toLocaleString()} possible deals that fit everything recorded so far. These are estimates, not certainties.</p></div>`;
}
const pct=p=>p>=0.995?'99%':p<0.01?'<1%':Math.round(p*100)+'%';
function gameView(S,D){
  const P=state.showPred!==false?predict(S,D):null;
  const verdict=`<section class="verdict" aria-label="Solution so far">${cats().map(cat=>{
    const sol=cat.cards.find(c=>S.K[c.id].env==='y'), left=cat.cards.filter(c=>S.K[c.id].env!=='n').length;
    return `<div class="slot ${sol?'solved':''}"><span class="q">${esc(cat.q||cat.name)}</span><span class="v">${sol?esc(sol.name):'?'}</span><span class="s">${sol?'Solved!':left+' left'}</span></div>`}).join('')}</section>`;

    <ol><li>On every turn, tap <b>Record a turn</b> and answer the questions. The sheet fills itself in.</li>

  const owners=[...state.players.map(p=>p.id),'env'];
  const head=state.players.map(p=>`<th scope="col"><div class="ph"><span class="pn ${p.id===state.me?'me':''}" title="${esc(pName(p.id))}">${p.id===state.me?'You':esc(pName(p.id))}</span><span class="meta">${D.sizes[p.id]} cards</span></div></th>`).join('')
    +`<th scope="col"><div class="ph"><span class="pn">Envelope</span><span class="meta">answer</span></div></th>`;
  let body='';
  cats().forEach(cat=>{
    body+=`<tr class="cat"><td class="namecol">${esc(cat.name)}</td><td colspan="${owners.length}"></td></tr>`;
    cat.cards.forEach(c=>{
      const k=S.K[c.id], sol=k.env==='y', cleared=k.env==='n';

      owners.forEach(o=>{
        const man=(state.marks[c.id]||{})[o], der=k[o], mb=!man&&!der&&S.maybe.has(c.id+'|'+o), bad=S.conflicts.has(c.id+'|'+o);
        const v=man||der||(mb?'m':''); const auto=!man&&(der||mb);
        const label=`${c.name}, ${pName(o)}: ${v==='y'?'has it':v==='n'?'does not have it':v==='m'?'maybe':'unknown'}${auto?' (worked out)':''}`;

        body+=`<td class="cell ${o==='env'?'env':''}"><button type="button" class="mk ${v} ${auto?'auto':''} ${bad?'conflict':''} ${showP?'pc':''}" data-a="cell" data-v="${c.id}|${o}" aria-label="${esc(label)}${showP?', '+pct(P.envP[c.id]||0)+' chance':''}">${v==='y'?'✓':v==='n'?'✕':v==='m'?'?':showP?pct(P.envP[c.id]||0):''}</button></td>`;
      });
      body+='</tr>';
    });
  });
  return `${verdict}${predCard(S,D,P)}${tip}
    ${S.conflicts.size?`<div class="alert">Some marks don’t add up (shown in red). Check them, or look at Menu → Turn history for a wrong entry.</div>`:''}
    <div class="gridwrap"><table class="sheet"><thead><tr><th class="namecol" scope="col">Card</th>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend"><span><i class="mk y">✓</i>has it</span><span><i class="mk n">✕</i>doesn’t</span><span><i class="mk m">?</i>maybe</span><span><i class="mk y auto">✓</i>dashed = worked out for you</span></div>
    <details><summary class="muted small" style="cursor:pointer">Notes</summary><textarea id="notes" style="margin-top:8px" placeholder="Anything worth remembering">${esc(state.notes)}</textarea></details>`;
}

  const n=state.players.length, s=pIdx(d.by); const order=[]; for(let i=1;i<n;i++)order.push(state.players[(s+i)%n]);

  if(!isAcc&&state.rule==='first'){
    html+=`<div class="qn"><h3>${q++}. Who showed ${byMe?'you':'them'} a card? <span class="sub">players are asked in this order</span></h3><div class="picks">${order.map(p=>`<button type="button" class="pick ${d.shower===p.id?'on':''}" data-a="d-shower" data-v="${p.id}" aria-pressed="${d.shower===p.id}">${p.id===state.me?'You':esc(pName(p.id))}</button>`).join('')}<button type="button" class="pick ${d.shower==='none'?'on':''}" data-a="d-shower" data-v="none" aria-pressed="${d.shower==='none'}">Nobody</button></div></div>`;
    if(byMe&&d.shower&&d.shower!=='none') html+=`<div class="qn"><h3>${q++}. Which card did they show you?</h3><div class="picks">${picked.map(id=>{const c=cardById(id);return `<button type="button" class="pick ${d.shown===id?'on':''}" data-a="d-shown" data-v="${id}" ${complete?'':'disabled'}>${dot(c)}${esc(c.name)}</button>`}).join('')||'<span class="muted small">Pick the three cards above first.</span>'}</div></div>`;
  }
  if(!isAcc&&state.rule==='all'){
    html+=`<div class="qn"><h3>${q++}. What did each player answer?</h3><div class="resp">${order.map(p=>{const r=d.resp[p.id];
      const opt=(v,l)=>`<button type="button" class="pick ${r===v?'on':''}" data-a="d-resp" data-v="${p.id}|${v}">${l}</button>`;
      return `<span class="who">${p.id===state.me?'You':esc(pName(p.id))}</span><div class="picks">${opt('none','No card')}${byMe?picked.map(id=>opt(id,'Showed '+esc(cardById(id).name))).join(''):opt('some','Showed a card')}</div>`}).join('')}</div></div>`;
  }
  const ready=complete&&(isAcc||state.rule==='all'||d.shower);
  return `<div class="scrim" data-a="closeturn-bg"><div class="dialog" role="dialog" aria-modal="true" aria-label="Record a turn">
    <div class="dhead"><div class="seg" role="group" aria-label="Turn type"><button type="button" data-a="d-type" data-v="suggest" aria-pressed="${!isAcc}">Suggestion</button><button type="button" data-a="d-type" data-v="accuse" aria-pressed="${isAcc}">Wrong accusation</button></div>
      <button class="x" type="button" data-a="closeturn" aria-label="Close">✕</button></div>
    <div class="dbody">${html}${isAcc?'<p class="hint">A wrong accusation means at least one of those three cards is not in the envelope.</p>':''}</div>
    <div class="dfoot"><button class="btn" type="button" data-a="closeturn">Cancel</button><button class="btn primary wide" type="button" data-a="saveturn" ${ready?'':'disabled'}>Save turn</button></div>
  </div></div>`;
}

/* ----- other views ----- */
function historyView(){
  const items=state.log.map((e,i)=>{
    const shownIds=e.responses?Object.values(e.responses):[e.shown];
    const names=e.cards.map(id=>{const c=cardById(id);return c?`<span class="tagc ${shownIds.includes(id)?'on':''}">${dot(c)}${esc(c.name)}</span>`:''}).join('');
    let res;
    if(e.type==='accuse')res='Wrong accusation';
    else if(e.responses){const p=Object.entries(e.responses).map(([pid,r])=>`${esc(pName(pid))}: ${r==='none'?'no card':r==='some'?'showed a card':'showed '+esc((cardById(r)||{}).name)}`);res=p.join(' · ')||'No answers';}
    else res=e.shower?`${esc(pName(e.shower))} showed ${e.shown?'<b>'+esc((cardById(e.shown)||{}).name)+'</b>':'a card'}`:'Nobody could show a card';
    return `<li><div class="t"><span><span class="count muted small">#${i+1}</span> <b>${e.by===state.me?'You':esc(pName(e.by))}</b> ${e.type==='accuse'?'accused':'asked about'}</span><div>${names}</div><span class="muted small">${res}</span></div>
      <button class="x" type="button" data-a="dellog" data-v="${i}" aria-label="Delete turn ${i+1}">✕</button></li>`}).reverse().join('');
  return `<div class="card"><h2>Turn history</h2>${state.log.length?`<ul class="log">${items}</ul><p class="muted small">Made a mistake? Delete the turn and record it again.</p>`:'<p class="muted">No turns yet. Tap <b>Record a turn</b> after each suggestion.</p>'}</div>`;
}
function settingsView(D){
  const h=D.sizes[state.me]; const full=cats().find(c=>c.cards.every(k=>state.hand.includes(k.id)));
  return `<div class="card"><h2>Players</h2>
      <div class="names">${state.players.map((p,i)=>`<div class="nrow"><span class="seat">${i===0?'You':i+1}</span><input type="text" id="sname-${p.id}" data-name="${p.id}" value="${esc(p.name)}" placeholder="${i===0?'Your name':'Player '+(i+1)}"></div>`).join('')}</div>
      <p class="muted small">To change the number of players, start a new game from the menu.</p></div>
    ${D.rem?`<div class="card"><h2>Extra cards</h2>
      <div class="seg" role="group"><button type="button" data-a="leftover" data-v="deal" aria-pressed="${state.leftover==='deal'}">Some players got an extra card</button><button type="button" data-a="leftover" data-v="faceup" aria-pressed="${state.leftover==='faceup'}">Leftovers face up</button></div>
      ${state.leftover==='deal'?`<p class="small">Tap the ${D.rem} player${D.rem>1?'s':''} who got ${D.base+1} cards <span class="count muted">· ${D.exCount} of ${D.rem}</span></p><div class="picks">${state.players.map(p=>`<button type="button" class="pick ${D.extra[p.id]?'on':''}" data-a="extra" data-v="${p.id}">${esc(pName(p.id))}</button>`).join('')}</div>`
        :`<p class="small">Tap the ${D.rem} face-up card${D.rem>1?'s':''} <span class="count muted">· ${state.faceup.length} of ${D.rem}</span></p><div class="picks">${allCards().map(c=>`<button type="button" class="pick ${state.faceup.includes(c.id)?'on':''}" data-a="faceup" data-v="${c.id}">${dot(c)}${esc(c.name)}</button>`).join('')}</div>`}
      ${D.known?'':'<p class="alert">Until this is filled in, the sheet won’t use hand sizes to work things out.</p>'}</div>`:''}
    <div class="card"><h2>Your cards <span class="count muted" style="font-size:15px;font-weight:400">${state.hand.length} of ${h}</span></h2>
      ${cats().map(cat=>`<div class="group"><span class="lab">${esc(cat.name)}</span><div class="picks">${cat.cards.filter(c=>!state.faceup.includes(c.id)).map(c=>`<button type="button" class="pick ${state.hand.includes(c.id)?'on':''}" data-a="hand" data-v="${c.id}">${dot(c)}${esc(c.name)}</button>`).join('')}</div></div>`).join('')}
      ${state.hand.length&&state.hand.length!==h?`<p class="alert">You should have ${h} cards (you’ve picked ${state.hand.length}).</p>`:''}
      ${full?`<p class="alert">You can’t have every card in ${esc(full.name)}.</p>`:''}</div>
    <div class="card"><h2>Table rules</h2>
      <div class="group"><span class="lab">When someone makes a suggestion</span>
        <div class="seg" role="group"><button type="button" data-a="rule" data-v="first" aria-pressed="${state.rule==='first'}">First player with a card shows it</button><button type="button" data-a="rule" data-v="all" aria-pressed="${state.rule==='all'}">Everyone answers</button></div></div>
      <label class="chk"><input type="checkbox" id="auto" ${state.auto?'checked':''}> Work things out automatically (dashed marks)</label></div>`;
}
function cardsView(){
  const back=!state.started?`<button class="btn" type="button" data-a="wizback">← Back to setup</button>`:'';
  return `${back}<div class="card"><div class="row spread"><h2>Cards</h2>
      <select id="preset" aria-label="Load an edition" style="width:auto"><option value="">Load an edition…</option>${Object.entries(PRESETS).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join('')}</select></div>
    ${state.pendingPreset?`<div class="confirm"><span>Load “${esc(PRESETS[state.pendingPreset].label)}”? This replaces all cards and clears the sheet.</span><button class="btn" type="button" data-a="loadpreset">Load it</button><button class="btn" type="button" data-a="cancelpreset">Cancel</button></div>`:''}
    <p class="muted small">Playing a themed or homemade version? Rename, recolor, add or remove cards. One card from each group goes in the envelope.</p>
    <div class="cats">${state.categories.map(cat=>`<div class="catbox"><div class="row" style="flex-wrap:nowrap"><input type="text" id="cat-${cat.id}" data-catname="${cat.id}" value="${esc(cat.name)}" aria-label="Group name" style="font-weight:600">${state.categories.length>1?`<button class="x" type="button" data-a="delcat" data-v="${cat.id}" aria-label="Delete group">✕</button>`:''}</div>
      ${cat.cards.map(c=>`<div class="crow"><input type="color" value="${esc(c.color||'#8a94a0')}" data-ccolor="${c.id}" aria-label="Color for ${esc(c.name)}"><input type="text" id="c-${c.id}" data-cname="${c.id}" value="${esc(c.name)}" aria-label="Card name"><button class="x" type="button" data-a="delcard" data-v="${c.id}" aria-label="Remove ${esc(c.name)}">✕</button></div>`).join('')||'<p class="muted small">No cards yet.</p>'}
      <form class="addrow" data-addcard="${cat.id}"><input type="text" id="add-${cat.id}" placeholder="Add a card"><button class="btn" type="submit">Add</button></form></div>`).join('')}</div>
    <button class="link" type="button" data-a="addcat">+ Add a group</button></div>`;
}
function helpView(D){
  let ref=''; for(let k=3;k<=6;k++){const b=Math.floor(D.dealtAll/k),r=D.dealtAll%k; ref+=`<tr><td>${k}</td><td>${r?`${r} get ${b+1}, ${k-r} get ${b}`:`all get ${b}`}</td></tr>`;}
  return `<div class="card"><h2>How to use this notebook</h2>
    <div class="stack small" style="max-width:65ch">
      <p><b>1. Set up.</b> Enter players clockwise starting with you, say who got an extra card, and tap the cards in your hand.</p>
      <p><b>2. Every turn.</b> Tap <b>Record a turn</b>: who asked, which three cards, and who showed a card. Players who passed get ✕ for all three cards. If you were shown a card, pick it and it gets ✓.</p>
      <p><b>3. Let it work things out.</b> Dashed marks were worked out for you, for example when a player’s hand is full, or when someone showed a card and the other two are ruled out. A <b>?</b> means “one of these could be theirs”.</p>
      <p><b>4. Your own notes.</b> Tap any box to cycle ✓ → ✕ → ? → blank. Your marks always win over worked-out ones.</p>
      <p><b>5. Solve it.</b> When only one card in a group can be in the envelope, it appears at the top. Get all three, then make your accusation.</p></div></div>
  <div class="card"><h2>Dealing the cards</h2>
    <p class="small" style="max-width:65ch">One card from each group goes into the envelope unseen. The other ${D.dealtAll} are dealt clockwise from the dealer’s left until none are left, so with 4 or 5 players some people get one extra card. Some tables put the leftovers face up instead.</p>
    <div style="overflow-x:auto"><table class="ref"><thead><tr><th>Players</th><th>Cards each (${D.dealtAll} dealt)</th></tr></thead><tbody>${ref}</tbody></table></div></div>`;
}

/* ---------- actions ---------- */
function removeCards(ids){
  ids.forEach(id=>delete state.marks[id]);
  state.categories.forEach(c=>c.cards=c.cards.filter(k=>!ids.includes(k.id)));
  state.faceup=state.faceup.filter(x=>!ids.includes(x)); state.hand=state.hand.filter(x=>!ids.includes(x));
  state.log=state.log.filter(e=>!e.cards.some(id=>ids.includes(id)));
}
const toggle=(arr,v)=>arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t){ if(state.menu&&!e.target.closest('.menu')) ui(()=>state.menu=false); return; }
  const a=t.dataset.a, v=t.dataset.v; const d=state.draft;
  if(a==='closeturn-bg'){ if(e.target===t) ui(()=>{state.modal=false}); return; }
  if(a!=='menu'&&state.menu) state.menu=false;
  switch(a){
    case 'count': ui(()=>{const n=+v; while(state.players.length<n)state.players.push({id:uid(),name:''}); state.players=state.players.slice(0,n); state.extras=[]; state.faceup=[];}); break;
    case 'next': ui(()=>{const D=dealInfo(); state.step = state.step===1&&D.rem===0 ? 3 : state.step+1;}); break;
    case 'back': ui(()=>{const D=dealInfo(); state.step = state.step===3&&D.rem===0 ? 1 : state.step-1;}); break;
    case 'wizcards': ui(()=>state.view='cards'); break;
    case 'wizback': ui(()=>state.view='game'); break;
    case 'extra': commit(()=>state.extras=toggle(state.extras||[],v)); break;
    case 'faceup': commit(()=>{state.faceup=toggle(state.faceup,v); state.hand=state.hand.filter(x=>x!==v);}); break;
    case 'leftover': commit(()=>{state.leftover=v; state.faceup=[]; }); break;
    case 'hand': commit(()=>state.hand=toggle(state.hand,v)); break;
    case 'start': ui(()=>{state.started=true; state.view='game'; history=[];}); break;
    case 'menu': ui(()=>state.menu=!state.menu); break;
    case 'view': ui(()=>{state.view=v; window.scrollTo(0,0);}); break;
    case 'hidetip': ui(()=>state.tip=false); break;
    case 'togglepred': ui(()=>state.showPred=state.showPred===false); break;
    case 'useask': {const S=solve(),P=predict(S,dealInfo()); if(!P||!P.ask)break; ui(()=>{const dr=defaultDraft(); dr.by=state.me; cats().forEach((cat,i)=>dr.cards[cat.id]=P.ask.ids[i]); state.draft=dr; state.modal=true;}); break;}
    case 'asknew': ui(()=>state.confirm='new'); break;
    case 'cancel': ui(()=>state.confirm=null); break;
    case 'donew': history=[]; ui(()=>{state=freshGame(state);}); break;
    case 'undo': if(history.length){state=JSON.parse(history.pop()); state.modal=false; state.menu=false; save(); render();} break;
    case 'cell': {const [cid,o]=v.split('|'); commit(()=>{const m=state.marks[cid]||(state.marks[cid]={}); const ord=[undefined,'y','n','m']; const nx=ord[(ord.indexOf(m[o])+1)%4]; if(nx)m[o]=nx; else delete m[o];}); break;}
    case 'openturn': ui(()=>{state.draft=defaultDraft(); state.modal=true;}); break;
    case 'closeturn': ui(()=>state.modal=false); break;
    case 'd-type': ui(()=>d.type=v); break;
    case 'd-by': ui(()=>{d.by=v; d.shower=null; d.shown=null; d.resp={};}); break;
    case 'd-card': ui(()=>{const [cat,cid]=v.split('|'); d.cards[cat]=d.cards[cat]===cid?undefined:cid; d.shown=null; for(const k in d.resp) if(d.resp[k]!=='none'&&d.resp[k]!=='some') delete d.resp[k];}); break;
    case 'd-shower': ui(()=>{d.shower=v; d.shown=null;}); break;
    case 'd-shown': ui(()=>d.shown=d.shown===v?null:v); break;
    case 'd-resp': ui(()=>{const [pid,r]=v.split('|'); d.resp[pid]=d.resp[pid]===r?undefined:r;}); break;
    case 'saveturn': {
      const cards=cats().map(c=>d.cards[c.id]).filter(Boolean); let entry;
      if(d.type==='accuse') entry={type:'accuse',by:d.by,cards};
      else if(state.rule==='all'){const responses={}; for(const pid in d.resp) if(d.resp[pid]&&pid!==d.by) responses[pid]=d.resp[pid]; entry={by:d.by,cards,responses};}
      else entry={by:d.by,cards,shower:d.shower==='none'?null:d.shower,shown:d.by===state.me?d.shown:null};
      commit(()=>{state.log.push(entry); state.modal=false;}); break;}
    case 'dellog': commit(()=>state.log.splice(+v,1)); break;
    case 'rule': ui(()=>state.rule=v); break;
    case 'delcard': commit(()=>removeCards([v])); break;
    case 'delcat': commit(()=>{const c=state.categories.find(x=>x.id===v); removeCards(c.cards.map(k=>k.id)); state.categories=state.categories.filter(x=>x.id!==v);}); break;
    case 'addcat': commit(()=>state.categories.push({id:uid(),name:'New group',q:'',cards:[]})); break;
    case 'loadpreset': commit(()=>{state.categories=buildCats(state.pendingPreset); state.marks={}; state.log=[]; state.hand=[]; state.faceup=[]; state.extras=[]; state.pendingPreset=null;}); break;
    case 'cancelpreset': ui(()=>state.pendingPreset=null); break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.name){const p=state.players.find(p=>p.id===t.dataset.name); if(p){p.name=t.value; save();}}
  if(t.id==='notes'){state.notes=t.value; save();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.name&&state.started) render();
  if(t.id==='auto') commit(()=>state.auto=t.checked);
  if(t.id==='preset'&&t.value) ui(()=>state.pendingPreset=t.value);
  if(t.dataset.catname){const v=t.value.trim(); if(v)commit(()=>state.categories.find(c=>c.id===t.dataset.catname).name=v);}
  if(t.dataset.cname){const v=t.value.trim(); if(v)commit(()=>{for(const c of state.categories){const k=c.cards.find(k=>k.id===t.dataset.cname); if(k)k.name=v;}});}
  if(t.dataset.ccolor) commit(()=>{for(const c of state.categories){const k=c.cards.find(k=>k.id===t.dataset.ccolor); if(k)k.color=t.value;}});
});
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target; if(!f.dataset.addcard)return;
  const inp=f.querySelector('input'); const v=inp.value.trim(); if(!v)return; const id=f.dataset.addcard;
  commit(()=>state.categories.find(c=>c.id===id).cards.push({id:uid(),name:v}));
  const again=document.getElementById('add-'+id); if(again)again.focus();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.modal||state.menu))ui(()=>{state.modal=false;state.menu=false;});});
render();
})();
</script>
</body>
</html>
